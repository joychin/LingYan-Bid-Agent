# 出客户端安装包（Windows + macOS，首个平台真机跑通后把坑补记回 docs/packaging.md）
#
# 触发：推送 v* tag 时构建一次（PR / 普通 push 的检查走 check.yml，不在此重复）。
#
# 2026-09-17 批次⑥加固：①tag 构建前置 ./check.sh（版本一致性+ruff/pytest+
# oxlint/tsc/vitest/build+cargo check/clippy/test——此前 tag 只打包不验证）；
# ②版本号从 tag 覆写**全部五处**（scripts/set_version.py，此前只写 tauri.conf.json
# 一处、其余四处靠人肉同步）；③动作固定 commit SHA；④job 加 permissions 与
# timeout；⑤Release 附 SHA256SUMS。
# 结构（三段式，防两平台并发上传撞「创建 Release」）：
#   ① build-windows / build-macos 并行：各自 冻结侧车（尾部自动跑 10 项冒烟门）
#      → tauri build → 产物传 workflow artifact
#   ② release：两平台全绿后统一建 Release、挂全部产物 + changelog 概要
#
# 配额账（重要）：macOS runner 按 10× 计费——一次 tag ≈ Windows 25min×2 + macOS
# 30min×10 = ~350 配额分钟；Free plan 2000 分钟/月 ≈ 5 次发版，谨慎打 tag。
# macOS 暂只出 arm64（Apple Silicon，团队主力）——universal（Intel 半边 + Rosetta
# 冻结）构建与配额翻倍，出现真实 Intel Mac 用户需求时再加 job。
#
# 已知边界（详见 AGENTS.md / docs/packaging.md）：
# - NSIS 覆盖安装不更新 externalBin（tauri#15134）——发版 version 由 tag 自动同步规避。
# - 未签名产物：Windows exe 杀软误报偏高；macOS dmg 为 ad-hoc 签名，发他人需
#   右键打开或 xattr -cr；正式代码签名证书=后续门。
# - msi 首次构建自动下载 WiX。
name: 出客户端安装包

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # 全历史：与 release job 同构（changelog describe 依赖）

      - name: 安装 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 安装 Rust (MSVC 工具链，版本随 rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: 安装 uv（管 sidecar 的独立 .build-venv）
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$HOME\.local\bin" | Out-File -Append $env:GITHUB_PATH -Encoding utf8

      - name: 安装根依赖（@tauri-apps/cli）
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 从 tag 同步版本号（全部五处 + package-lock）
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "✗ tag 格式须为 vX.Y.Z（实际：${VERSION}）" >&2; exit 1 ;;
          esac
          python3 scripts/set_version.py "${VERSION}"

      - name: 冻结 sidecar + 自动冒烟门（10 项）
        shell: bash
        run: bash sidecar/build_sidecar.sh

      - name: Tauri 构建（前端 build + Rust release + nsis/msi）
        shell: bash
        run: npx tauri build

      - name: 上传产物（workflow artifact）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-bundle
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-macos:
    name: macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 安装 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 安装 Rust (aarch64-apple-darwin，版本随 rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: 安装 uv（管 sidecar 的独立 .build-venv）
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 安装根依赖（@tauri-apps/cli）
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 从 tag 同步版本号（全部五处 + package-lock）
        run: |
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "✗ tag 格式须为 vX.Y.Z（实际：${VERSION}）" >&2; exit 1 ;;
          esac
          python3 scripts/set_version.py "${VERSION}"

      - name: 冻结 sidecar + 自动冒烟门（10 项）
        run: bash sidecar/build_sidecar.sh

      - name: Tauri 构建（前端 build + Rust release + dmg）
        run: npx tauri build

      - name: 上传产物（workflow artifact）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-bundle
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 出包前的质量门（2026-09-17 批次⑥）：check.yml 只覆盖 main/PR，tag 直接触发
  # 的是本 workflow——「已红的 main 不能直接出包」由此守住。独立 ubuntu job 跑
  # 完整 ./check.sh（版本一致性+ruff/pytest+oxlint/tsc/vitest/build+cargo 三件），
  # 两平台 build 与它并行、release 等三者全绿（检查失败时 build 白跑 ~8 分钟是
  # 接受的代价，省掉 macOS 10× 计费上跑完整检查的更贵方案）
  check:
    name: 出包前全栈检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 安装 Rust（锁 1.98.0——release 可重现性；本地开发用 rustup 默认 stable，MSRV 由 Cargo.toml rust-version 把守）
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: 安装 uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 安装根依赖（@tauri-apps/cli）
        run: npm ci

      - name: 安装前端依赖（check.sh frontend 段需要）
        working-directory: frontend
        run: npm ci

      - name: 从 tag 同步版本号（五处；check_versions 要求五处一致后才过检查）
        run: python3 scripts/set_version.py "${{ github.ref_name }}"

      - name: 全栈检查
        run: ./check.sh

  release:
    name: 挂 Release（两平台产物 + changelog）
    needs: [check, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # softprops/action-gh-release 需向 Release 附加文件

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # changelog 的 git describe 需要上一个 tag 可达（shallow 下拉不到 tag 引用的 commit）

      - name: 下载两平台产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: 生成 changelog 概要（上一个 tag 至今的 commit 列表）
        run: |
          git fetch --tags --quiet
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "${PREV_TAG}..${GITHUB_REF_NAME}" > CHANGELOG_CI.md
            echo "==> changelog 基于 ${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            echo "首次发布（无先前 tag 对比）。" > CHANGELOG_CI.md
            echo "==> 首次发布，changelog 为空说明"
          fi

      # GitHub 会把 Release 资产名里的非 ASCII 字符整段剥掉：v0.2.0 实测
      # 灵燕智能_0.2.0_x64-setup.exe → _0.2.0_x64-setup.exe（产品名全丢，下载页
      # 与用户本地磁盘文件名都成了「_0.2.0_…」；旧名 Tender Agent 只是空格→点，
      # 所以一直没暴露）。上传前把下载文件名换成 ASCII slug；label 仍带中文，
      # 应用与安装器内的显示名来自 productName，都不受影响。
      # 显示名真源=frontend/src/lib/brand.ts（CI 读不到 TS，故 slug 在此单列）。
      - name: 产物改 ASCII 下载名（GitHub 剥资产名里的中文）
        env:
          PRODUCT_NAME: 灵燕智能
          RELEASE_SLUG: LingYan
        run: |
          find dist -type f -print0 | while IFS= read -r -d '' f; do
            b="$(basename "$f")"
            nb="${b//$PRODUCT_NAME/$RELEASE_SLUG}"
            # 兜底：其余非 ASCII 与空格一并换掉，避免再出现被剥空/断名
            nb="$(printf '%s' "$nb" | sed -E 's/[^A-Za-z0-9._-]+/_/g; s/_+/_/g; s/^[-_.]+//')"
            if [ "$nb" != "$b" ]; then
              mv "$f" "$(dirname "$f")/$nb"
              echo "  $b → $nb"
            fi
          done
          echo "==> 待上传产物："
          find dist -type f | sort

      - name: 生成校验和（未签名产物的最低完整性凭据）
        run: |
          cd dist && find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec sha256sum {} + | tee SHA256SUMS

      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # 工作区相对路径：Git Bash 的 /tmp（C 盘用户临时目录）与 Node（softprops）
          # 的 /tmp（工作盘根）解析不一致，绝对路径会静默读不到、body 落空
          body_path: CHANGELOG_CI.md
          files: |
            dist/**
            dist/SHA256SUMS
