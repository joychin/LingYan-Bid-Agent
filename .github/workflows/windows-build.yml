# 出 Windows 客户端安装包（首次真机构建，跑通后把坑补记回 docs/packaging.md §3）
#
# 触发：推送 v* tag 时构建一次（PR / 普通 push 不跑，省配额）。
# 流水线与本地 `npm run build:release` 同构：
#   ① build_sidecar.sh 冻结 Python 侧车（Windows 上目标=本机 OS，尾部自动跑 10 项冒烟门）
#   ② tauri build 出 nsis/*.exe + msi/*.msi
#   ③ 产物上传到该 tag 的 GitHub Release
#
# 已知边界（详见 AGENTS.md / docs/packaging.md）：
# - NSIS 覆盖安装不更新 externalBin（tauri#15134）——发版前把 src-tauri/tauri.conf.json 的
#   version 抬一位（与 tag 一致），靠版本号变化规避。
# - 未签名 exe 杀软误报偏高；正式代码签名证书=后续门。
# - msi 首次构建会自动下载 WiX（GHA 网络可用）。
name: 出 Windows 包

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    permissions:
      contents: write # softprops/action-gh-release 需向 Release 附加文件

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 安装 Rust (MSVC 工具链)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 uv（管 sidecar 的独立 .build-venv）
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$HOME\.local\bin" | Out-File -Append $env:GITHUB_PATH -Encoding utf8

      - name: 安装根依赖（@tauri-apps/cli）
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 从 tag 同步版本号到 tauri.conf.json
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "✗ tag 格式须为 vX.Y.Z（实际：${VERSION}）" >&2; exit 1 ;;
          esac
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1].replace(/^v/,'');fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');" "${VERSION}"
          echo "==> version 已同步为 ${VERSION#v}"

      - name: 冻结 sidecar + 自动冒烟门（10 项）
        shell: bash
        run: bash sidecar/build_sidecar.sh

      - name: Tauri 构建（前端 build + Rust release + nsis/msi）
        shell: bash
        run: npx tauri build

      - name: 生成 changelog 概要（上一个 tag 至今的 commit 列表）
        shell: bash
        run: |
          git fetch --tags --quiet
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "${PREV_TAG}..${GITHUB_REF_NAME}" > /tmp/CHANGELOG.md
            echo "==> changelog 基于 ${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            echo "首次发布（无先前 tag 对比）。" > /tmp/CHANGELOG.md
            echo "==> 首次发布，changelog 为空说明"
          fi

      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/CHANGELOG.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
