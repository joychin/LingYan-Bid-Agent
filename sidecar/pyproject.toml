[project]
name = "tender-agent-sidecar"
version = "0.1.0"
description = "Tender Agent local-first sidecar: FastAPI + DeepAgents + SQLite"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.7",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "python-docx",
    "pymupdf>=1.24",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "sse-starlette",
    "langchain-deepseek>=1.1.0",
    "httpx",
    "trafilatura>=2.0",
    "jieba>=0.42.1",
]

# 国内网络必须（pypi.org 直连会 TLS 超时）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = [
    "e2e: 端到端冒烟（spawn 真实 sidecar + LLM 一轮；uv run pytest -m e2e）",
]
