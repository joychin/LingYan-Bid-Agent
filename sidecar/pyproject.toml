[project]
name = "tender-agent-sidecar"
version = "0.1.0"
description = "Tender Agent local-first sidecar: FastAPI + DeepAgents + SQLite"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.7",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "python-docx",
    "pymupdf>=1.24",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "sse-starlette",
    "langchain-deepseek>=1.1.0",
    "httpx",
    "trafilatura>=2.0",
    "jieba>=0.42.1",
    # vlm.py / api/settings.py 直用 openai SDK（ChatCompletions + 连通性测试），
    # 原先靠 langchain-openai 的传递依赖裸用，显式声明转正（版本=uv.lock 既有解析）
    "openai==3.3.1",
    "tenacity>=9",
]

# 国内网络必须（pypi.org 直连会 TLS 超时）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # pydantic 模型 → TS interface 生成（CLI 命令名 pydantic2ts；契约单一事实源用）
    "pydantic-to-typescript",
]

[tool.ruff]
target-version = "py312"
# 不启用 formatter（待工作区干净后再一次性全量格式化，避免大 diff 混入功能改动）
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = "-m 'not e2e'"
markers = [
    "e2e: 端到端冒烟（spawn 真实 sidecar + LLM 一轮；uv run pytest -m e2e）",
]
